<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的工作小本本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one calm column like a weekly planner refill. Each day is a page row: a rounded date stamp on the left, the day's lines on the right.
   Today's page has a faint dot grid. Blue ink on white paper; vermilion only for things fixed or overdue, like a hanko. */
:root{
  --bg:#EEF3F9;        /* pale sky paper behind the pages */
  --paper:#FFFFFF;
  --paper-2:#F6F9FC;   /* sunk fields, inputs */
  --ink:#1F2B3D;       /* navy ink, never pure black */
  --muted:#66748A;
  --faint:#97A3B5;
  --line:#DCE4EE;
  --rule:#E7EDF4;      /* the dashed ruled lines between entries */
  --accent:#2C5BA6;    /* 藍 indigo-blue */
  --accent-2:#5B86C9;
  --accent-soft:#E4EDF9;
  --seal:#C24E36;      /* 朱 vermilion — fixed times, overdue */
  --seal-soft:#FBEBE6;
  --ok:#2E7A63; --ok-soft:#E1F1EB;
  --dot:#DCE5F1;       /* dot grid */
  --tape:#BFD3EE;      /* washi tape */
  --shadow:0 1px 0 rgba(31,43,61,.04), 0 2px 8px rgba(44,91,166,.06);
  --a-work:#3A5F98; --a-partner:#B0683A; --a-me:#C2577E; --a-health:#3E8468; --a-home:#8C6E46; --a-pet:#9A5F96; --a-money:#7A7A34; --a-project:#2B8094; --a-hobby:#6E5BA6; --a-people:#C0583A; --a-misc:#6F7480;
  --round:"Zen Maru Gothic","PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1621; --paper:#172130; --paper-2:#1C2838; --ink:#E3E9F2; --muted:#9AA8BC; --faint:#6C7A8F; --line:#28354A; --rule:#223045;
  --accent:#8FB3EC; --accent-2:#6E97D8; --accent-soft:#1E3150; --seal:#F0957C; --seal-soft:#3A2220; --ok:#7FCDB2; --ok-soft:#173329;
  --dot:#223149; --tape:#2C4568; --shadow:0 1px 0 rgba(0,0,0,.2);
  --a-work:#8FB0E6; --a-partner:#E2A47A; --a-me:#EE9DBC; --a-health:#82CDAE; --a-home:#D1B184; --a-pet:#D7A2D3; --a-money:#C9C980; --a-project:#7BCBDB; --a-hobby:#B6A6E8; --a-people:#F0A086; --a-misc:#B2B8C4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1621; --paper:#172130; --paper-2:#1C2838; --ink:#E3E9F2; --muted:#9AA8BC; --faint:#6C7A8F; --line:#28354A; --rule:#223045;
  --accent:#8FB3EC; --accent-2:#6E97D8; --accent-soft:#1E3150; --seal:#F0957C; --seal-soft:#3A2220; --ok:#7FCDB2; --ok-soft:#173329;
  --dot:#223149; --tape:#2C4568; --shadow:0 1px 0 rgba(0,0,0,.2);
  --a-work:#8FB0E6; --a-partner:#E2A47A; --a-me:#EE9DBC; --a-health:#82CDAE; --a-home:#D1B184; --a-pet:#D7A2D3; --a-money:#C9C980; --a-project:#7BCBDB; --a-hobby:#B6A6E8; --a-people:#F0A086; --a-misc:#B2B8C4;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:28px 72px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ── header ── */
header{display:flex;flex-direction:column;gap:10px}
.titleRow{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{position:relative;margin:0;font-family:var(--body);font-weight:700;font-size:24px;letter-spacing:.06em;text-wrap:balance;padding-inline:2px;z-index:0}
h1::before{content:"";position:absolute;z-index:-1;left:-8px;right:-10px;bottom:5px;height:11px;border-radius:2px;transform:rotate(-1.2deg);
  background:repeating-linear-gradient(90deg,var(--tape) 0 10px,color-mix(in srgb,var(--tape) 70%,transparent) 10px 14px);opacity:.9}
.toolsBtn{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.toolsBtn svg{width:15px;height:15px}
.toolsBtn[aria-expanded="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:baseline}
.sum b{font-family:var(--round);font-weight:700;color:var(--ink);font-size:15px;margin-right:2px}
.sum .late b{color:var(--seal)}
.sum .date{color:var(--ink);font-weight:500}

.toolsBody{display:flex;flex-direction:column;gap:8px}
.toolsBody:not(:has(> :not([hidden]))){display:none}
.capture{display:flex;gap:8px}
input,select,textarea{font:inherit;color:var(--ink);font-size:16px}
.field,.capture input{font-size:16px;flex:1;min-width:0;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.field:focus,.capture input:focus,.editor :is(input,select,textarea):focus,.bookline input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn{border-radius:10px;border:1px solid var(--line);background:var(--paper);padding:7px 13px;font-size:14px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:500}
.btn.sm{padding:3px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.danger{color:var(--seal)}

/* ── index tabs, like the cut tabs on a planner's edge ── */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1.5px solid var(--line);scrollbar-width:none;margin-bottom:-6px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;white-space:nowrap;border:1.5px solid transparent;border-bottom:0;border-radius:12px 12px 0 0;background:transparent;padding:7px 14px 6px;font-size:14px;color:var(--muted);margin-bottom:-1.5px}
.tabs button:hover{color:var(--ink)}
.tabs{position:relative}
.tabs button{position:relative;z-index:1}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:500}
/* 选中标签下面那块纸片，换标签时滑过去 */
.tabInk{position:absolute;z-index:0;background:var(--paper);border:1.5px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;pointer-events:none;
  transition:left .38s cubic-bezier(.45,0,.25,1),width .38s cubic-bezier(.45,0,.25,1)}
.tabInk::after{content:"";position:absolute;left:0;right:0;bottom:-1.5px;height:2px;background:var(--paper)}
.wrap{position:relative;overflow-x:clip}

section.panel{display:flex;flex-direction:column;gap:12px}
.status{font-size:13px;color:var(--muted)}
.empty{color:var(--faint);font-size:13.5px;padding:6px 0}

/* ── cards ── */
.box,.day{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.box{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.box h2{font-family:var(--body);font-weight:700;font-size:16px;margin:0;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.box h2 .count{font-family:var(--round);font-weight:500;font-size:13px;color:var(--faint)}
.box.oweBox{border-color:color-mix(in srgb,var(--seal) 35%,var(--line));background:linear-gradient(var(--seal-soft),var(--seal-soft)) top/100% 44px no-repeat,var(--paper)}
.box.oweBox h2{color:var(--seal)}

/* ── day pages ── */
.day{display:flex;flex-direction:column;gap:2px;padding:12px 16px 10px}
.dayhead{display:flex;align-items:center;gap:8px;padding-bottom:4px}
.dayhead .dd{font-family:var(--round);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:var(--ink)}
.dayhead .wk{font-size:13px;color:var(--muted)}
.day.weekend .dayhead .wk{color:var(--accent)}
.dayhead .rel{font-size:12px;font-weight:500;border-radius:999px;padding:0 9px;line-height:1.8;background:var(--accent-soft);color:var(--accent)}
.day.today .dayhead .rel{background:var(--accent);color:var(--paper)}
.load{margin-left:auto;font-family:var(--round);font-weight:500;font-size:14px;color:var(--faint);font-variant-numeric:tabular-nums}
.load b{color:var(--accent);font-weight:700}
.load.free{font-family:var(--body);font-size:12px}


/* ── entries ── */
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:9px 0;border-top:1px dashed var(--rule)}
li.item:first-child{border-top:0}
.chk{width:20px;height:20px;border-radius:7px;border:1.5px solid var(--accent-2);background:var(--paper);padding:0;margin-top:2px;position:relative;flex:none}
.chk:hover{background:var(--accent-soft)}
.chk::after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:9px;border:solid transparent;border-width:0 2px 2px 0;transform:rotate(45deg)}
li.done .chk{background:var(--accent);border-color:var(--accent)}
li.done .chk::after{border-color:var(--paper)}
li.done .t{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.t{min-width:0;overflow-wrap:anywhere}
/* 点一行 = 展开/收起备注；有备注的行标题后面带一个小三角 */
.body[data-act="note"]{cursor:pointer}
.body[data-act="note"]:hover .t{color:var(--accent)}
.t[role="button"]{border-radius:6px}
/* 有备注的小箭头：紧跟标题最后一个字，细线 SVG（不用 ▸ 字符：iPhone 的中文字体把它排成全角，前后空出一大块） */
.nh{display:inline-block;width:9px;height:9px;margin-left:3px;vertical-align:0;color:var(--faint);transition:transform .18s ease,color .15s;overflow:visible}
.tl{white-space:nowrap}
.t[aria-expanded="true"] .nh{transform:rotate(90deg);color:var(--accent)}
.pen{width:32px;height:32px;margin:-5px -6px -5px 0;border:0;background:transparent;border-radius:9px;color:var(--faint);padding:0;font-size:16px;line-height:1;display:inline-grid;place-items:center;flex:none}
.pen:hover,.pen[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
/* 跳过：没做、也不欠着。灰掉，不划线（和做完区分开），带一个「跳过」小签 */
li.skipped .t{color:var(--faint)}
li.skipped .chk{border-color:var(--line);background:var(--paper-2)}
li.skipped .chk::after{left:4px;top:8px;width:9px;height:0;border-width:0 0 1.5px 0;border-color:var(--faint);transform:none}
li.skipped .tm{color:var(--faint);border-color:var(--faint)}
.skipchip{font-size:11.5px;color:var(--faint);border:1px dashed var(--faint);border-radius:6px;padding:0 6px;line-height:1.55;white-space:nowrap}
.foldDone .sk{color:var(--faint);font-size:12.5px}
.foldDone .fk.skf{background:var(--paper-2);color:var(--faint);border:1px dashed var(--line)}
.tm{display:inline-block;font-family:var(--round);font-weight:500;font-size:13.5px;color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}
.tm.approx{color:var(--faint)}
.tm.fixed{color:var(--seal);border:1.5px solid var(--seal);border-radius:6px;padding:0 5px;line-height:1.45;font-weight:700}
.dur{font-size:12px;color:var(--faint);margin-left:8px;white-space:nowrap}
.meta{display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:3px;min-width:0;align-items:center}
.stamp{font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.stamp i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.stamp.ar{color:var(--c)}
.stamp.ar span{color:var(--muted)}
.kind{font-size:11.5px;color:var(--muted);background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:1.6}
.chip{font-size:12px;padding:0 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.75}
.due{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.due.late,.lateTxt{color:var(--seal);font-weight:500}
.note{font-size:12.5px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px;line-height:1.6}
li.locked .t{color:var(--muted)}
.chip.pj{font-weight:500;display:inline-flex;gap:4px;min-width:0}
.chip.pj .pn{overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip.pj .ps{flex:none}
.chip.pj.wait{background:var(--paper-2);color:var(--muted);border:1px solid var(--line);line-height:1.6}
/* 项目小标签可以点：跳到「项目」页对应的那一步 */
button.chip.go{border:0;font-family:inherit;cursor:pointer;text-align:left;align-items:center}
button.chip.go.wait{border:1px solid var(--line)}
button.chip.go .gochev{flex:none;margin-left:1px;opacity:.6;font-weight:700}
button.chip.go:hover{background:color-mix(in srgb,var(--accent) 16%,var(--paper))}
button.chip.go.wait:hover{background:var(--accent-soft);color:var(--accent)}
button.chip.go:hover .gochev{opacity:1}
button.chip.go:active{transform:scale(.97)}
.hl{background:var(--accent-soft)!important}
.hlCard{box-shadow:0 0 0 3px var(--accent-soft)!important}
.adot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);vertical-align:3px;margin-right:7px}
.day .note{background:var(--paper-2);border-radius:10px;padding:6px 10px;margin-top:6px}
/* ⓘ popover */
.hdrBtns{display:flex;gap:8px;align-items:center;flex:none}
.infoBtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-family:var(--round);font-weight:700;font-size:14px;padding:0}
.infoBtn[aria-expanded="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.infoWrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:10;width:min(330px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 8px 28px rgba(31,43,61,.16);display:flex;flex-direction:column;gap:9px;font-size:13px;color:var(--ink)}
.pop{display:grid!important;grid-template-columns:auto 1fr;gap:9px 12px;align-items:center}
.pop[hidden]{display:none!important}
.pop .r{display:contents}
.pop .r > :first-child{justify-self:start;margin-right:0}
.pop{max-width:calc(100vw - 32px);max-height:min(70vh,calc(100vh - 120px));overflow-y:auto;overscroll-behavior:contain;align-content:start}
.popHead{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:-2px}
.popHead b{font-size:13.5px;font-weight:700;letter-spacing:.04em;color:var(--ink)}
.popX{flex:none;width:28px;height:28px;border-radius:50%;border:0;background:var(--paper-2);color:var(--muted);padding:0;font-size:14px;line-height:1;display:inline-grid;place-items:center}
.popX:hover{color:var(--accent);background:var(--accent-soft)}
.popBackdrop{position:fixed;inset:0;z-index:50;background:rgba(15,22,33,.42)}
@media (min-width:601px){.popBackdrop{display:none!important}}
@media (max-width:600px){
  .pop{position:fixed;left:50%;top:50%;right:auto;transform:translate(-50%,-50%);z-index:51;width:min(380px,calc(100vw - 32px));max-height:70vh;border-radius:18px;padding:14px 16px 16px;box-shadow:0 18px 48px rgba(15,22,33,.28)}
}
.pop .demo-chk{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--accent-2);display:inline-block}
.lockTxt{font-size:11.5px;color:var(--faint)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}


/* ── editor ── */
.editor{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:12px;margin-top:6px;background:var(--paper-2);border-radius:14px;border:1px solid var(--line)}
.editor label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.editor input,.editor select,.editor textarea{font-size:16px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--paper);min-width:0}
.editor textarea{min-height:60px;resize:vertical}
.editor .row{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap}
.editor .row .danger{margin-left:auto}

/* ── projects ── */
.proj{gap:10px}
.ph{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.ph h2{font-size:17px}
.prog{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.bar{height:10px;border-radius:999px;background:var(--accent-soft);overflow:hidden;position:relative}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px;min-width:10px}
.bar.zero span{min-width:0}
.pct{font-family:var(--round);font-weight:700;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.pct small{font-weight:500;font-size:12px;color:var(--faint);margin-left:4px}
.nextstep{font-size:14px;background:var(--paper-2);border-radius:12px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.nextstep .lbl{font-size:12px;color:var(--accent);font-weight:500}
.nextstep b{font-weight:500}
details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:2px 0}
details summary:hover{color:var(--accent)}
.pmenu{margin-left:auto;position:relative}
.pmenu summary{list-style:none;cursor:pointer;font-size:18px;line-height:1;padding:3px 10px 7px;border-radius:9px;color:var(--muted)}
.pmenu summary::-webkit-details-marker{display:none}
.pmenu[open] summary{background:var(--accent-soft)}
.pmenu-list{position:absolute;right:0;top:100%;margin-top:4px;z-index:5;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;display:flex;flex-direction:column;min-width:128px;box-shadow:0 6px 20px rgba(31,43,61,.14)}
.pmenu-list button{border:0;text-align:left;padding:8px 10px;background:transparent;border-radius:8px;font-size:14px}
.pmenu-list button:hover{background:var(--accent-soft)}
.stagechip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;line-height:1.7}
.stall{font-size:12.5px;color:var(--seal);background:var(--seal-soft);border-radius:10px;padding:5px 10px}
/* 项目总览：按阶段分组的小方块，每块只有 emoji + 名字 + 进度条 */
.pgrp{display:flex;flex-direction:column;gap:8px;min-width:0}
.pgh{display:flex;align-items:center;gap:6px;margin:6px 2px 0;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.pgh .count{font-family:var(--round);font-weight:500;font-size:12.5px;color:var(--faint);letter-spacing:0}
details.pgrp > summary.pgh{list-style:none;cursor:pointer;padding:0;color:var(--muted)}
details.pgrp > summary.pgh::-webkit-details-marker{display:none}
details.pgrp > summary.pgh:hover{color:var(--accent)}
.pgh .car{width:9px;height:9px;color:var(--faint);transition:transform .18s ease}
details.pgrp[open] > summary .car{transform:rotate(90deg)}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;min-width:0}
.ptile{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;aspect-ratio:5/4;padding:12px 13px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);color:var(--ink)}
.ptile:hover{border-color:var(--accent-2)}
.ptile:active{transform:scale(.98)}
.ptile .pe{font-size:22px;line-height:1;height:26px;display:flex;align-items:center}
.ptile .mono{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;font-size:13px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--paper))}
.ptile .pn{font-size:14.5px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere;word-break:break-word;min-width:0}
.ptile .pfoot{margin-top:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.ptile .bar{display:block;height:6px}
.ptile .bar span{min-width:6px}
.ptile .bar.zero span{min-width:0}
.ptile .pc{font-family:var(--round);font-weight:500;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.ptile .idle{position:absolute;top:12px;right:11px;font-size:11px;color:var(--faint);background:var(--paper-2);border-radius:999px;padding:0 7px;line-height:1.75;white-space:nowrap}
.ptile .idle.wk{color:var(--muted)}
.ptile.done .bar span{background:var(--ok)}
/* 标题两行 + 小签放不下时让方块长高，不压扁标题 */
.ptile > *{flex-shrink:0}
/* 小签：等待中 / 下一步，放在标题下面的空处，小而安静 */
.ptile .ptag{align-self:flex-start;max-width:100%;font-size:11.5px;line-height:1.75;padding:0 8px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ptile .ptag.can{color:var(--accent);background:var(--accent-soft);display:inline-flex;gap:4px}
/* 下一步小签：步骤名太长就省略，日子总是露出来 */
.ptile .ptag.can .nt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ptile .ptag.can .nd{flex:none}
.ptile .ptag.wt{color:var(--muted);border:1px dashed var(--line);background:var(--paper);line-height:1.6}
/* 等待中：整块调淡、进度条变灰，球不在自己这边 */
.ptile.waiting{background:var(--paper-2);box-shadow:none}
.ptile.waiting .pn{color:var(--muted)}
.ptile.waiting .pe{opacity:.55;filter:grayscale(.7)}
.ptile.waiting .bar{background:var(--line)}
.ptile.waiting .bar span{background:var(--faint)}
.ptile.waiting .pc{color:var(--faint)}
.abs{color:var(--faint);font-size:.88em;font-weight:400}
.pwait .pwsrc{color:var(--faint);font-size:12px;margin-left:4px}
.chip.wtc{background:var(--paper-2);color:var(--muted);border:1px dashed var(--line);line-height:1.6}
.pwait{font-size:13px;color:var(--muted);background:var(--paper-2);border:1px dashed var(--line);border-radius:10px;padding:5px 10px;overflow-wrap:anywhere;word-break:break-word}
.waitform{margin-top:-2px}
@media (prefers-reduced-motion:no-preference){.ptile{transition:border-color .15s,transform .12s}}
/* 单个项目的详情页 */
.pdetail{gap:10px}
.pdHead{display:flex;align-items:flex-start;gap:10px}
.pdHead h2{flex:1;font-size:19px;line-height:1.4;letter-spacing:.03em;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.pdHead .pmenu{margin-left:0;flex:none;margin-top:-2px}
.pdTags{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.stagechip.doing{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));background:var(--accent-soft)}
.stagechip.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:var(--ok-soft)}
.pdFacts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin:2px 0 0;font-size:14px;background:var(--paper-2);border-radius:12px;padding:10px 12px}
.pdFacts dt{font-size:12.5px;color:var(--muted);white-space:nowrap;line-height:1.75}
.pdFacts dd{margin:0;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.pdFacts dd .due{margin-left:6px;white-space:nowrap}
.pdFacts dd.wy{white-space:pre-wrap;color:var(--ink)}
.pdSteps .pgh{margin:4px 0 2px}
li.item.cur{background:var(--accent-soft);border-radius:12px;margin-inline:-10px;max-width:none;width:calc(100% + 20px);padding-inline:10px;border-top-color:transparent;box-shadow:inset 3px 0 0 var(--accent)}
li.item.cur + li.item{border-top-color:transparent}
li.item.cur .t{font-weight:500}


.foot{text-align:center;font-size:11px;color:var(--faint);letter-spacing:.04em;padding-top:12px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;max-width:calc(100% - 32px)}
.legend{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
/* done items fold into one line at the bottom of each day page */
.fold{border-top:1px dashed var(--rule);margin-top:2px}
.foldDone{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:9px 0 3px;font-size:13.5px;color:var(--muted);text-align:left;border-radius:8px}
.foldDone:hover{color:var(--accent)}
.foldDone .fk{width:20px;height:20px;border-radius:7px;background:var(--ok-soft);color:var(--ok);display:inline-grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.foldDone b{display:inline-block;font-family:var(--round);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin-inline:2px}
.foldDone .car{display:inline-block;width:9px;height:9px;color:var(--faint);transition:transform .18s ease}
.foldDone[aria-expanded="true"] .car{transform:rotate(90deg)}
ul.doneList{padding-bottom:2px}
ul.doneList li.item:first-child{border-top:1px dashed var(--rule)}
li.ticking .chk{background:var(--accent);border-color:var(--accent)}
li.ticking .chk::after{border-color:var(--paper)}
li.ticking .t{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
@media (prefers-reduced-motion:no-preference){ li.ticking > div{opacity:.55;transition:opacity .18s ease-out} }
@media (max-width:420px){
  .day{padding-inline:14px}
  h1{font-size:22px}
  .toolsBtn .lbl{display:none}
  .toolsBtn{padding:0;width:30px;height:30px;justify-content:center}
}
@media (prefers-reduced-motion:no-preference){.area,.btn,.chk{transition:border-color .15s,background-color .15s}}
/* 长标题不撑破屏幕：弹性/网格里的子元素都允许缩到 0，长串字母也能断行，小标签自己截断 */
.body,.t,.note,.meta,.nextstep,.nextstep b,.ph h2,.box h2,.area h3,.area .next,.rline > span,.status,.stall{min-width:0;max-width:100%}
.t,.note,.nextstep b,.ph h2,.box h2,.area h3,.area .next,.rline .rt,.status,.stall{overflow-wrap:anywhere;word-break:break-word}
.meta > *,button.chip,.chip.pj{min-width:0;max-width:100%}
.chip.pj .pn{flex:0 1 auto}
.prog{grid-template-columns:minmax(0,1fr) auto}
.pop{grid-template-columns:auto minmax(0,1fr)}
.box,.day,.area,li.item{min-width:0;max-width:100%}
.editor input,.editor select,.editor textarea{width:100%;max-width:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

/* ── work version additions ── */
.langBtn{min-width:38px;justify-content:center;font-weight:500}
.box.newsBox{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:linear-gradient(var(--accent-soft),var(--accent-soft)) top/100% 44px no-repeat,var(--paper)}
.box.newsBox h2{color:var(--accent)}
.box.othersBox{background:var(--paper-2);box-shadow:none}
.box.othersBox h2{color:var(--muted)}
.box > .fold:first-child{border-top:0;margin-top:0}
.box > .fold:first-child .foldDone{padding-top:0}
.subh{font-size:12px;color:var(--faint);letter-spacing:.06em;margin-top:4px}
/* 首页里的项目行：emoji + 名字 + 回来时从哪接着做，点了进项目页 */
li.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:9px 0;border-top:1px dashed var(--rule);cursor:pointer}
li.prow:first-child{border-top:0}
li.prow:hover .t{color:var(--accent)}
.pemo{width:20px;height:20px;margin-top:2px;display:inline-grid;place-items:center;font-size:16px;line-height:1}
.pemo .mono{width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft)}
.resume{font-size:13px;color:var(--muted);overflow-wrap:anywhere;word-break:break-word}
.resume::before{content:"↪ ";color:var(--accent-2)}
.gochev2{color:var(--faint);font-weight:700;font-size:16px;line-height:1.4}
.star{color:#D9A21B;font-size:12px;margin-left:4px}
/* 状态小签 */
.st{font-size:11.5px;border-radius:999px;padding:0 8px;line-height:1.75;white-space:nowrap;border:1px solid transparent}
.st.waiting_me{color:var(--seal);background:var(--seal-soft)}
.st.waiting_others{color:var(--muted);background:var(--paper);border:1px dashed var(--line);line-height:1.6}
.st.doing,.st.todo{color:var(--accent);background:var(--accent-soft)}
.st.paused{color:var(--faint);background:var(--paper-2)}
.st.done{color:var(--ok);background:var(--ok-soft)}
.st.skipped{color:var(--faint);border:1px dashed var(--faint);line-height:1.6}
.newsTag{font-size:11.5px;color:var(--accent);font-weight:500;white-space:nowrap}
.newsLine{flex-basis:100%;display:block;font-size:12.5px;color:var(--muted);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.newsLine b{color:var(--accent);font-weight:600}
/* 链接小片：CL / GH / chat / bug / doc */
.links{display:flex;flex-wrap:wrap;gap:6px}
a.lchip{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:12.5px;line-height:1.8;padding:0 10px 0 4px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-decoration:none;min-width:0}
a.lchip:hover{border-color:var(--accent-2);color:var(--accent)}
a.lchip .lk{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:0 6px;line-height:1.7;background:var(--accent-soft);color:var(--accent)}
a.lchip .ll{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
a.lchip.k-bug .lk{background:var(--seal-soft);color:var(--seal)}
a.lchip.k-gh .lk{background:var(--paper-2);color:var(--ink)}
a.lchip.k-doc .lk{background:var(--ok-soft);color:var(--ok)}
a.lchip.sm{font-size:11.5px;line-height:1.6}
/* 项目页 */
.pdSummary{font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.resumeBox{font-size:14.5px;background:var(--accent-soft);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 3px 0 0 var(--accent)}
.resumeBox .lbl{font-size:12px;color:var(--accent);font-weight:500;letter-spacing:.04em}
.resumeBox b{font-weight:500;overflow-wrap:anywhere;word-break:break-word}
.pdActs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.ptile.me{border-color:color-mix(in srgb,var(--seal) 40%,var(--line))}
.ptile .ptag.me{color:var(--seal);background:var(--seal-soft)}
.ptile .pstar{position:absolute;top:10px;right:11px;color:#D9A21B;font-size:13px}
.ptile .pstar + .idle{right:28px}

.loose{border-color:color-mix(in srgb,var(--seal) 30%,var(--line))}
.loose .lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:0;background:transparent;padding:0;text-align:left;font-size:16px;font-weight:700;letter-spacing:.03em}
.loose .lh:hover{color:var(--accent)}
.loose .lh .idle{font-size:11.5px;font-weight:400;color:var(--faint);background:var(--paper-2);border-radius:999px;padding:0 7px;line-height:1.75}
.connBad{font-size:12.5px;color:var(--seal);background:var(--seal-soft);border-radius:10px;padding:5px 10px}

// ── 数据层：和上游一样的接口（collection().onSnapshot/add，doc().update/set/delete/get），
// 底下是 GET /api/db 轮询 + POST /api/op。快照里的 doc 多一个 version，用于 if_version。
function makeStore(fetchSnap, sendOp){
  let snap = null, subs = [];
  const colSnap = c => ({docs: Object.entries(((snap && snap.collections) || {})[c] || {}).map(([id, v]) =>
    ({id, exists: true, version: ((snap && snap.versions) || {})[c + "/" + id] || 0, data: () => ({...v})}))});
  const emit = () => subs.forEach(s => s.f(colSnap(s.c)));
  async function refresh(){ const s = await fetchSnap(); if (s){ snap = s; emit(); } }
  async function op(body){ const res = await sendOp(body); await refresh().catch(() => {}); return res; }
  const ifv = o => o && o.ifVersion !== undefined && o.ifVersion !== null ? {if_version: o.ifVersion} : {};
  return {
    refresh,
    collection: c => ({
      onSnapshot: f => { const s = {c, f}; subs.push(s); if (snap) f(colSnap(c)); return () => { subs = subs.filter(x => x !== s); }; },
      add: v => op({op:"add", path:c, data:v})}),
    doc: path => ({
      update: (v, o) => op({op:"update", path, data:v, ...ifv(o)}),
      set: (v, o) => op({op:"set", path, data:v, ...ifv(o)}),
      delete: o => op({op:"delete", path, ...ifv(o)}),
      get: async () => { await refresh().catch(() => {}); const [c, id] = path.split("/"); const v = snap && snap.collections[c] && snap.collections[c][id];
        return {id, exists: !!v, data: () => v ? {...v} : undefined}; }}),
  };
}
function httpDb(){
  let etag = null;
  const fetchSnap = async () => {
    const r = await fetch("/api/db", {cache:"no-store", headers: etag ? {"If-None-Match": etag} : {}});
    if (r.status === 304) return null;
    if (!r.ok) throw new Error("GET /api/db " + r.status);
    etag = r.headers.get("ETag"); return r.json(); };
  const sendOp = async body => {
    const r = await fetch("/api/op", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok){ const e = new Error(j.error || ("POST /api/op " + r.status)); e.code = r.status === 409 ? "conflict" : "http_" + r.status; throw e; }
    return j; };
  return makeStore(fetchSnap, sendOp);
}
